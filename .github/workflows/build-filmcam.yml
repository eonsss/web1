name: Build FilmCam APK

on:
  workflow_dispatch:
  push:
    paths:
      - "film-cam/**"
      - ".github/workflows/build-filmcam.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: film-cam
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # 선택: 저장소 시크릿에 KEYSTORE_BASE64 등을 넣으면 고정 키로 서명된다.
      - name: Prepare signing key (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK has no network permission
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump permissions "$APK" | tee perms.txt
          ! grep -q "INTERNET" perms.txt
          "$BT/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" | tee "$APK.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: FilmCam-apk
          path: |
            film-cam/app/build/outputs/apk/release/*.apk
            film-cam/app/build/outputs/apk/release/*.sha256
          retention-days: 30
