<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>삼각 퍼즐 - Triangle Flow</title>
<style>
  :root { --bg:#0f1424; --card:#fff; --accent:#2f6bff; --text:#e8ecf8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; max-width:760px; margin:0 auto; padding:8px 12px 10px; gap:8px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  header h1 { font-size:18px; margin:0; letter-spacing:.5px; }
  .stats { display:flex; gap:12px; font-size:14px; opacity:.9; font-variant-numeric:tabular-nums; }
  #stage { flex:1; min-height:0; background:var(--card); border-radius:14px; overflow:hidden;
    box-shadow:0 6px 24px rgba(0,0,0,.45); display:flex; }
  svg { width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none; display:block; }
  .piece { cursor:grab; }
  .piece.drag { cursor:grabbing; }
  .piece polygon { stroke:#fff; stroke-width:.05; stroke-linejoin:round; fill-opacity:.9; }
  .piece.sel polygon { stroke:#111; stroke-width:.06; }
  .piece.snap { transition:transform .15s ease-out; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  button { font:inherit; font-size:14px; color:var(--text); background:#1d2540; border:1px solid #2c3760;
    border-radius:10px; padding:9px 12px; cursor:pointer; }
  button:active { background:#2a3560; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #win { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(8,12,24,.65); z-index:10; }
  #win.show { display:flex; }
  #win .box { background:#fff; color:#111; padding:26px 30px; border-radius:18px; text-align:center; min-width:240px;
    animation:pop .35s cubic-bezier(.2,1.4,.4,1); }
  #win h2 { margin:0 0 6px; font-size:26px; }
  #win p { margin:0 0 16px; color:#555; }
  #win .row { display:flex; gap:8px; justify-content:center; }
  #win button { color:#fff; }
  #win button.sec { background:#e5e9f5; color:#222; border-color:#e5e9f5; }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .help { font-size:12px; text-align:center; opacity:.65; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>▲ 삼각 퍼즐</h1>
    <div class="stats"><span id="lvl">레벨 1</span><span id="time">0:00</span></div>
  </header>
  <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="toolbar">
    <button id="bRot">↻ 회전</button>
    <button id="bFlip">⇋ 뒤집기</button>
    <button id="bHint">💡 힌트</button>
    <button id="bReset">⟲ 다시</button>
    <button id="bPrev">◀</button>
    <button id="bNext">▶</button>
    <button id="bRand">🎲 새 퍼즐</button>
  </div>
  <div class="help">조각을 끌어 윤곽에 맞추세요 · 탭 = 회전 · 우클릭/뒤집기 버튼 = 뒤집기 (R / F 키)</div>
</div>
<div id="win"><div class="box">
  <h2>🎉 완성!</h2><p id="winMsg"></p>
  <div class="row"><button class="sec" id="wAgain">다시하기</button><button class="primary" id="wNext">다음 레벨</button></div>
</div></div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const H = Math.sqrt(3) / 2;               // 정삼각형(한 변 1)의 높이
const COLORS = ['#2f5bff', '#e8261f', '#f5b800', '#1ea84b', '#ff7a1a', '#8b3fd9', '#12b5b0', '#e83e8c'];

/* ---------- 삼각 격자 기하 ----------
   셀 (r,c): (r+c)가 짝수면 ▲, 홀수면 ▼. 한 칸의 x폭은 0.5, 행 높이는 H. */
const isUp = (r, c) => ((r + c) & 1) === 0;
const verts = (r, c) => isUp(r, c)
  ? [[c + 1, r], [c, r + 1], [c + 2, r + 1]]
  : [[c, r], [c + 2, r], [c + 1, r + 1]];            // [vx, vr] 격자 꼭짓점
const toXY = (vx, vr) => [vx * 0.5, vr * H];
const centroid = (r, c) => [(c + 1) / 2, (r + (isUp(r, c) ? 2 / 3 : 1 / 3)) * H];
const polyPoints = (r, c) => verts(r, c).map(([vx, vr]) => toXY(vx, vr).join(',')).join(' ');

function normalize(cells) {
  let minR = Infinity, minC = Infinity;
  for (const [r, c] of cells) { minR = Math.min(minR, r); minC = Math.min(minC, c); }
  const dr = -minR; let dc = -minC;
  if ((dr + dc) & 1) dc += 1;                         // 평행이동은 ▲▼ 성질을 유지해야 함
  return cells.map(([r, c]) => [r + dr, c + dc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function xform(cells, k, flip) {                      // 60°×k 회전 + 선택적 좌우 반전
  const a = k * Math.PI / 3, cs = Math.cos(a), sn = Math.sin(a);
  return normalize(cells.map(([r, c]) => {
    let [x, y] = centroid(r, c);
    x -= 0.5;                                         // 격자 꼭짓점 (vx=1, vr=0)을 중심으로 회전/반전
    if (flip) x = -x;
    const X = x * cs - y * sn + 0.5, Y = x * sn + y * cs;
    const rr = Math.floor(Y / H), up = (Y / H - rr) > 0.5;
    const cc = Math.round(2 * X) - 1;
    if (isUp(rr, cc) !== up) throw new Error('lattice mismatch');
    return [rr, cc];
  }));
}
function bbox(cells) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [r, c] of cells) for (const [vx, vr] of verts(r, c)) {
    const [x, y] = toXY(vx, vr);
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

/* ---------- 레벨 생성 (정답 배치를 먼저 만들어 항상 풀 수 있음) ---------- */
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ROWS = 6, COLS = 17;
const inB = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const nbrs = (r, c) => [[r, c - 1], [r, c + 1], isUp(r, c) ? [r + 1, c] : [r - 1, c]].filter(([a, b]) => inB(a, b));

function generate(seed, n, minS, maxS) {
  const rand = rng(seed), pick = a => a[Math.floor(rand() * a.length)];
  for (let attempt = 0; attempt < 2000; attempt++) {
    const used = new Set(), pieces = [];
    let ok = true;
    for (let i = 0; i < n && ok; i++) {
      const size = minS + Math.floor(rand() * (maxS - minS + 1));
      let start;
      if (i === 0) start = [2 + Math.floor(rand() * 2), 6 + Math.floor(rand() * 5)];
      else {
        const cand = [];                                  // 중복 = 인접할수록 가중치↑ (뭉툭한 모양)
        for (const k of used) { const [r, c] = k.split(',').map(Number);
          for (const [a, b] of nbrs(r, c)) if (!used.has(a + ',' + b)) cand.push([a, b]); }
        if (!cand.length) { ok = false; break; }
        start = pick(cand);
      }
      const cells = [start], set = new Set([start.join(',')]);
      while (cells.length < size) {
        const fr = [];
        for (const [r, c] of cells) for (const [a, b] of nbrs(r, c)) {
          const k = a + ',' + b; if (!set.has(k) && !used.has(k)) fr.push([a, b]);
        }
        if (!fr.length) break;
        const p = pick(fr); cells.push(p); set.add(p.join(','));
      }
      if (cells.length < 3) { ok = false; break; }
      for (const c of cells) used.add(c.join(','));
      pieces.push(cells);
    }
    if (!ok) continue;
    let hole = false;                                     // 한 칸짜리 구멍 방지
    for (let r = 0; r < ROWS && !hole; r++) for (let c = 0; c < COLS; c++) {
      if (used.has(r + ',' + c)) continue;
      const nb = [[r, c - 1], [r, c + 1], isUp(r, c) ? [r + 1, c] : [r - 1, c]];
      if (nb.every(([a, b]) => inB(a, b) && used.has(a + ',' + b))) { hole = true; break; }
    }
    if (hole) continue;
    const all = normalize(pieces.flat());                 // 전체를 원점으로 이동 (같은 shift 적용)
    let minR = Infinity, minC = Infinity;
    for (const [r, c] of pieces.flat()) { minR = Math.min(minR, r); minC = Math.min(minC, c); }
    const dr = -minR; let dc = -minC; if ((dr + dc) & 1) dc += 1;
    return pieces.map(p => p.map(([r, c]) => [r + dr, c + dc]));
  }
  throw new Error('generation failed');
}

const LEVELS = [
  [3, 4, 6], [4, 4, 6], [4, 3, 6], [5, 4, 6], [5, 3, 6], [6, 4, 6],
  [6, 3, 6], [7, 4, 6], [7, 3, 6], [8, 4, 6], [8, 3, 6], [9, 3, 6],
];

/* ---------- 게임 상태 ---------- */
const svg = document.getElementById('svg');
let G = null;               // 현재 게임
let timer = null, t0 = 0, elapsed = 0, levelIdx = 0, randomMode = false;

function build(spec, seed) {
  const [n, minS, maxS] = spec;
  const sols = generate(seed, n, minS, maxS);
  const rand = rng(seed * 7 + 1);
  const target = new Set(sols.flat().map(c => c.join(',')));
  const tb = bbox(sols.flat());

  const pieces = sols.map((abs, i) => {
    const base = normalize(abs);
    const cells = xform(base, Math.floor(rand() * 6), rand() < 0.5);
    return { id: i, color: COLORS[i % COLORS.length], cells, solAbs: abs, placed: false,
             pos: { x: 0, y: 0 }, home: { x: 0, y: 0 }, el: null, at: null };
  });

  // 레이아웃: 위 = 보드, 아래 = 트레이
  const margin = 1;
  const trayW = Math.max(tb.w + margin * 2, 8.5);
  const ox = (trayW - tb.w) / 2 - tb.x0, oy = margin - tb.y0;
  const boardBottom = margin + tb.h + margin;
  let x = margin, y = boardBottom + 0.8, rowH = 0;
  for (const p of pieces) {
    const b = bbox(p.cells);
    if (x + b.w > trayW - margin + 1e-6 && x > margin) { x = margin; y += rowH + 0.7; rowH = 0; }
    p.pos = { x: x - b.x0, y: y - b.y0 };
    p.home = { x: x + b.w / 2, y: y + b.h / 2 };
    x += b.w + 0.7; rowH = Math.max(rowH, b.h);
  }
  const totalH = y + rowH + margin;
  return { spec, seed, pieces, target, ox, oy, W: trayW, Hh: totalH, trayTop: boardBottom, sel: null, done: false };
}

function el(name, attrs = {}, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

function render() {
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${G.W} ${G.Hh}`);
  // 트레이 배경
  el('rect', { x: 0, y: G.trayTop, width: G.W, height: G.Hh - G.trayTop, fill: '#eef1f7' }, svg);
  el('line', { x1: 0, x2: G.W, y1: G.trayTop, y2: G.trayTop, stroke: '#d5dae8', 'stroke-width': .06 }, svg);

  // 보드: 목표 칸 + 윤곽선
  const gb = el('g', { transform: `translate(${G.ox},${G.oy})` }, svg);
  const edgeCount = new Map();
  for (const k of G.target) {
    const [r, c] = k.split(',').map(Number);
    el('polygon', { points: polyPoints(r, c), fill: '#f7f9ff', stroke: '#c3cadd', 'stroke-width': .03 }, gb);
    const v = verts(r, c);
    for (let i = 0; i < 3; i++) {
      const a = v[i], b = v[(i + 1) % 3];
      const ek = [a.join(','), b.join(',')].sort().join('|');
      edgeCount.set(ek, (edgeCount.get(ek) || 0) + 1);
    }
  }
  for (const [ek, cnt] of edgeCount) {
    if (cnt !== 1) continue;
    const [a, b] = ek.split('|').map(s => s.split(',').map(Number));
    const [x1, y1] = toXY(...a), [x2, y2] = toXY(...b);
    el('line', { x1, y1, x2, y2, stroke: '#111', 'stroke-width': .09, 'stroke-linecap': 'round' }, gb);
  }
  G.hintG = el('g', { transform: `translate(${G.ox},${G.oy})`, 'pointer-events': 'none' }, svg);
  G.ghostG = el('g', { transform: `translate(${G.ox},${G.oy})`, 'pointer-events': 'none' }, svg);
  G.pieceG = el('g', {}, svg);
  for (const p of G.pieces) { p.el = el('g', { class: 'piece', 'data-id': p.id }, G.pieceG); drawPiece(p); }
}

function drawPiece(p) {
  p.el.innerHTML = '';
  for (const [r, c] of p.cells) el('polygon', { points: polyPoints(r, c), fill: p.color }, p.el);
  p.el.classList.toggle('sel', G.sel === p);
  setPos(p, p.pos.x, p.pos.y);
}
function setPos(p, x, y) { p.pos = { x, y }; p.el.setAttribute('transform', `translate(${x},${y})`); }
const localCenter = p => bbox(p.cells);
const centerOf = p => { const b = localCenter(p); return { x: p.pos.x + b.cx, y: p.pos.y + b.cy }; };
function setCenter(p, x, y) { const b = localCenter(p); setPos(p, x - b.cx, y - b.cy); }

function clampCenter(p, x, y) {
  const b = localCenter(p);
  return [Math.min(Math.max(x, b.w / 2), G.W - b.w / 2), Math.min(Math.max(y, b.h / 2), G.Hh - b.h / 2)];
}

/* ---------- 스냅 / 배치 ---------- */
function occupied(except) {
  const m = new Set();
  for (const q of G.pieces) if (q.placed && q !== except) for (const [r, c] of q.at.cells) m.add(r + ',' + c);
  return m;
}
function trySnap(p) {
  const [r0, c0] = p.cells[0];
  const cx = p.pos.x - G.ox + centroid(r0, c0)[0], cy = p.pos.y - G.oy + centroid(r0, c0)[1];
  let best = null, bd = Infinity;
  for (let r = -3; r < ROWS + 3; r++) for (let c = -3; c < COLS + 4; c++) {
    if (isUp(r, c) !== isUp(r0, c0)) continue;
    const [x, y] = centroid(r, c), d = (x - cx) ** 2 + (y - cy) ** 2;
    if (d < bd) { bd = d; best = [r, c]; }
  }
  if (!best || bd > 0.9 ** 2) return null;
  const dr = best[0] - r0, dc = best[1] - c0;
  const occ = occupied(p), abs = p.cells.map(([r, c]) => [r + dr, c + dc]);
  for (const [r, c] of abs) { const k = r + ',' + c; if (!G.target.has(k) || occ.has(k)) return { ok: false, dr, dc, cells: abs }; }
  return { ok: true, dr, dc, cells: abs };
}
function place(p, s, animate) {
  p.placed = true; p.at = { dr: s.dr, dc: s.dc, cells: s.cells };
  if (animate) { p.el.classList.add('snap'); setTimeout(() => p.el.classList.remove('snap'), 200); }
  setPos(p, G.ox + s.dc * 0.5, G.oy + s.dr * H);
}
function sendHome(p) {
  p.placed = false; p.at = null;
  setCenter(p, ...clampCenter(p, p.home.x, p.home.y));
}
function showGhost(p) {
  G.ghostG.innerHTML = '';
  if (!p) return;
  const s = trySnap(p);
  if (!s) return;
  for (const [r, c] of s.cells)
    el('polygon', { points: polyPoints(r, c), fill: s.ok ? p.color : '#888', 'fill-opacity': s.ok ? .35 : .15,
      stroke: s.ok ? p.color : '#888', 'stroke-width': .06, 'stroke-dasharray': '.15 .1' }, G.ghostG);
}

/* ---------- 조각 변형 ---------- */
function transform(p, k, flip) {
  const wasPlaced = p.placed;
  let c = centerOf(p);
  if (wasPlaced) { p.placed = false; p.at = null; c = { x: p.home.x, y: p.home.y }; }
  p.cells = xform(p.cells, k, flip);
  p.el.parentNode.appendChild(p.el);
  const b = localCenter(p);
  const [x, y] = clampCenter(p, c.x, c.y);
  p.pos = { x: x - b.cx, y: y - b.cy };
  drawPiece(p);
}
function select(p) {
  G.sel = p;
  for (const q of G.pieces) q.el.classList.toggle('sel', q === p);
}

/* ---------- 포인터 입력 ---------- */
const pt = svg.createSVGPoint();
function svgPoint(e) {
  pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM().inverse(), q = pt.matrixTransform(m);
  return { x: q.x, y: q.y };
}
let drag = null;
svg.addEventListener('pointerdown', e => {
  if (!G || G.done) return;
  const g = e.target.closest('.piece');
  if (!g) return;
  e.preventDefault();
  if (e.button === 2) { const p = G.pieces[+g.dataset.id]; select(p); transform(p, 0, true); return; }
  const p = G.pieces[+g.dataset.id], sp = svgPoint(e);
  select(p);
  p.el.parentNode.appendChild(p.el);
  drag = { p, off: { x: sp.x - p.pos.x, y: sp.y - p.pos.y }, sx: e.clientX, sy: e.clientY, moved: false, wasPlaced: p.placed, startPos: { ...p.pos } };
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
  if (!drag.moved) { drag.moved = true; drag.p.placed = false; drag.p.at = null; drag.p.el.classList.add('drag'); }
  const sp = svgPoint(e);
  setPos(drag.p, sp.x - drag.off.x, sp.y - drag.off.y);
  showGhost(drag.p);
});
function endDrag(e) {
  if (!drag) return;
  const { p, moved, wasPlaced } = drag; drag = null;
  p.el.classList.remove('drag'); showGhost(null);
  if (!moved) {                                   // 탭: 트레이 조각은 회전, 놓인 조각은 트레이로 회수
    if (wasPlaced) { p.placed = false; p.at = null; sendHome(p); p.el.classList.add('snap'); setTimeout(() => p.el.classList.remove('snap'), 200); }
    else transform(p, 1, false);
    return;
  }
  const s = trySnap(p);
  if (s && s.ok) { place(p, s, true); checkWin(); }
  else {
    const c = centerOf(p);
    if (c.y > G.trayTop + 0.3) { const [x, y] = clampCenter(p, c.x, c.y); setCenter(p, x, y); p.home = { x, y }; }
    else { p.el.classList.add('snap'); sendHome(p); setTimeout(() => p.el.classList.remove('snap'), 200); }
  }
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 승리 / 타이머 ---------- */
function checkWin() {
  let n = 0;
  for (const q of G.pieces) if (q.placed) n += q.cells.length;
  if (n !== G.target.size) return;
  G.done = true; clearInterval(timer);
  const t = fmt(elapsed);
  document.getElementById('winMsg').textContent = `걸린 시간 ${t}`;
  const last = !randomMode && levelIdx >= LEVELS.length - 1;
  document.getElementById('wNext').textContent = randomMode ? '새 퍼즐' : last ? '처음으로' : '다음 레벨';
  if (!randomMode) try { localStorage.setItem('tri-puzzle-max', Math.max(+(localStorage.getItem('tri-puzzle-max') || 0), levelIdx + 1)); } catch (_) {}
  setTimeout(() => document.getElementById('win').classList.add('show'), 350);
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function startTimer() {
  clearInterval(timer); elapsed = 0; t0 = Date.now();
  document.getElementById('time').textContent = '0:00';
  timer = setInterval(() => { elapsed = Math.floor((Date.now() - t0) / 1000); document.getElementById('time').textContent = fmt(elapsed); }, 500);
}

/* ---------- 레벨 흐름 ---------- */
function load(spec, seed, label) {
  document.getElementById('win').classList.remove('show');
  G = build(spec, seed);
  render();
  document.getElementById('lvl').textContent = label;
  startTimer();
}
function loadLevel(i) {
  randomMode = false;
  levelIdx = (i + LEVELS.length) % LEVELS.length;
  load(LEVELS[levelIdx], 100 + levelIdx * 13, `레벨 ${levelIdx + 1}`);
}
function loadRandom() {
  randomMode = true;
  const spec = LEVELS[Math.min(Math.max(levelIdx, 2), LEVELS.length - 1)];
  load(spec, Math.floor(Math.random() * 1e6), '랜덤');
}
function replay() { randomMode ? load(G.spec, G.seed, '랜덤') : loadLevel(levelIdx); }

document.getElementById('bRot').onclick = () => { if (G && !G.done && G.sel) transform(G.sel, 1, false); };
document.getElementById('bFlip').onclick = () => { if (G && !G.done && G.sel) transform(G.sel, 0, true); };
document.getElementById('bReset').onclick = replay;
document.getElementById('bPrev').onclick = () => loadLevel(randomMode ? levelIdx : levelIdx - 1);
document.getElementById('bNext').onclick = () => loadLevel(randomMode ? levelIdx : levelIdx + 1);
document.getElementById('bRand').onclick = loadRandom;
document.getElementById('wAgain').onclick = replay;
document.getElementById('wNext').onclick = () => randomMode ? loadRandom() : loadLevel(levelIdx + 1);
document.getElementById('bHint').onclick = () => {
  if (!G || G.done) return;
  const cand = G.pieces.filter(p => !sameCells(p));
  const p = cand[Math.floor(Math.random() * cand.length)];
  if (!p) return;
  G.hintG.innerHTML = '';
  for (const [r, c] of p.solAbs) el('polygon', { points: polyPoints(r, c), fill: p.color, 'fill-opacity': .45, stroke: p.color, 'stroke-width': .08 }, G.hintG);
  clearTimeout(G.hintT); G.hintT = setTimeout(() => G.hintG.innerHTML = '', 1800);
};
function sameCells(p) {
  if (!p.placed) return false;
  const a = p.at.cells.map(c => c.join(',')).sort().join(';'), b = p.solAbs.map(c => c.join(',')).sort().join(';');
  return a === b;
}
window.addEventListener('keydown', e => {
  if (!G || G.done || !G.sel) return;
  if (e.key === 'r' || e.key === 'R') transform(G.sel, 1, false);
  if (e.key === 'f' || e.key === 'F') transform(G.sel, 0, true);
});

let start = 0;
try { start = Math.min(+(localStorage.getItem('tri-puzzle-max') || 0), LEVELS.length - 1); } catch (_) {}
loadLevel(start);
window.__game = { get G() { return G; }, trySnap, place, checkWin, transform, loadLevel, LEVELS };
})();
</script>
