<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>삼각 퍼즐</title>
<style>
  :root { --text:#eaf0ff; --gold:#ffd54a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; color:var(--text); overflow:hidden;
    font-family:-apple-system, "Noto Sans KR", "Malgun Gothic", sans-serif; }
  body {
    background:
      radial-gradient(2px 2px at 12% 22%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.5px 1.5px at 82% 12%, rgba(130,220,255,.9), transparent),
      radial-gradient(2px 2px at 70% 58%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 28% 76%, rgba(130,220,255,.8), transparent),
      radial-gradient(2px 2px at 92% 86%, rgba(255,255,255,.7), transparent),
      radial-gradient(2px 2px at 6% 90%, rgba(255,200,255,.7), transparent),
      radial-gradient(ellipse at 50% -10%, #5b3fd1 0%, #2a2a8f 38%, #0b0f45 100%);
    background-attachment:fixed;
  }
  #app { display:flex; flex-direction:column; height:100%; max-width:760px; margin:0 auto; padding:10px 12px 12px; gap:8px; }

  /* HUD */
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
    background:linear-gradient(#ffffff14,#ffffff06); border:1px solid #ffffff1f; border-radius:18px; padding:8px 10px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;
    background:#0a0f3c99; border:1px solid #ffffff26; border-radius:999px; padding:6px 12px; justify-self:start; box-shadow:inset 0 2px 6px #0006; }
  .pill.right { justify-self:end; }
  .pill small { font-weight:600; opacity:.6; font-size:11px; }
  .center { display:flex; align-items:center; gap:6px; }
  .badge { width:78px; height:78px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 35% 25%, #8fd0ff, #2f6bff 55%, #1b2f9e);
    border:4px solid #ffd54a; box-shadow:0 0 0 3px #7a4a10, 0 6px 16px #0008, 0 0 24px #4de1ff66, inset 0 -6px 10px #0004; margin:-14px 0 -10px; }
  .badge small { font-size:10px; letter-spacing:1.5px; font-weight:800; opacity:.9; text-shadow:0 1px 2px #0008; }
  .badge b { font-size:28px; line-height:1; text-shadow:0 2px 4px #0009; }
  .nav { width:34px; height:34px; border-radius:50%; padding:0; font-size:14px; line-height:1;
    background:linear-gradient(#ffffff26,#ffffff0d); border:1px solid #ffffff33; }
  #stars { text-align:center; font-size:26px; letter-spacing:6px; margin:6px 0 -2px; color:#ffffff30; text-shadow:0 2px 0 #0004; }
  #stars .on { color:var(--gold); text-shadow:0 0 12px #ffb300, 0 2px 0 #7a4a10; }

  #stage { flex:1; min-height:0; display:flex; }
  svg { width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none; display:block; overflow:visible; }
  .piece { cursor:grab; filter:url(#shadow); }
  .piece.sel { filter:url(#shadowSel); }
  .piece.drag { cursor:grabbing; }
  .piece polygon { stroke:rgba(255,255,255,.7); stroke-width:.035; stroke-linejoin:round; }
  .piece polygon.facet { stroke:none; pointer-events:none; }
  .piece.snap { transition:transform .15s ease-out; }

  /* 버튼 */
  .toolbar { display:flex; gap:10px; justify-content:center; }
  .gbtn { display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:0; padding:0; color:var(--text);
    font:inherit; font-size:11px; font-weight:700; cursor:pointer; text-shadow:0 1px 2px #000a; }
  .gbtn i { font-style:normal; width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;
    border:3px solid #ffffffcc; box-shadow:0 5px 0 #0006, 0 8px 14px #0007, inset 0 4px 6px #fff6, inset 0 -6px 8px #0003; transition:transform .08s; }
  .gbtn:active i { transform:translateY(4px); box-shadow:0 1px 0 #0006, inset 0 4px 6px #fff6; }
  .c-blue i   { background:linear-gradient(#6fc3ff,#2f6bff); }
  .c-purple i { background:linear-gradient(#c58bff,#7a3fe0); }
  .c-gold i   { background:linear-gradient(#ffe27a,#ff9d1a); }
  .c-green i  { background:linear-gradient(#7ff0a0,#1faa55); }
  .c-pink i   { background:linear-gradient(#ff9ac4,#e0306f); }
  .help { font-size:11px; text-align:center; opacity:.6; }

  /* 승리 */
  #win { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(5,8,32,.72); z-index:10; overflow:hidden; }
  #win.show { display:flex; }
  #win .box { position:relative; background:linear-gradient(#3b3fc4,#1a1f6b); color:#fff; padding:26px 30px 22px; border-radius:22px; text-align:center; min-width:270px;
    border:4px solid var(--gold); box-shadow:0 0 0 3px #7a4a10, 0 14px 40px #000a, 0 0 50px #ffd54a55; animation:pop .4s cubic-bezier(.2,1.4,.4,1); }
  #win h2 { margin:0; font-size:30px; text-shadow:0 3px 0 #0006; }
  .wstars { font-size:46px; letter-spacing:6px; margin:6px 0; }
  .wstars span { display:inline-block; color:#ffffff30; }
  .wstars span.on { color:var(--gold); text-shadow:0 0 18px #ffb300, 0 3px 0 #7a4a10; animation:starin .5s both; }
  #win p { margin:0 0 16px; opacity:.85; }
  #win .row { display:flex; gap:10px; justify-content:center; }
  .btn { font:inherit; font-weight:800; font-size:15px; color:#fff; border:3px solid #ffffffcc; border-radius:999px; padding:10px 20px; cursor:pointer;
    background:linear-gradient(#6fc3ff,#2f6bff); box-shadow:0 4px 0 #0006, inset 0 3px 5px #fff6; }
  .btn.sec { background:linear-gradient(#c9a8ff,#7a3fe0); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #0006; }
  .confetti { position:absolute; top:-20px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards; pointer-events:none; }
  @keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }
  @keyframes pop { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes starin { from { transform:scale(2.4) rotate(-30deg); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (max-height:640px) { .badge { width:64px; height:64px; } .badge b { font-size:22px; } .gbtn i { width:46px; height:46px; font-size:20px; } .help { display:none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="pill"><span>🏆</span><span id="best">--</span></div>
    <div class="center">
      <button class="nav" id="bPrev">◀</button>
      <div class="badge" id="lvl"><small>LEVEL</small><b>1</b></div>
      <button class="nav" id="bNext">▶</button>
    </div>
    <div class="pill right"><span>⏱</span><span id="time">0:00</span></div>
  </header>
  <div id="stars">★★★</div>
  <div id="stage"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="toolbar">
    <button class="gbtn c-blue" id="bRot"><i>↻</i>회전</button>
    <button class="gbtn c-purple" id="bFlip"><i>⇋</i>뒤집기</button>
    <button class="gbtn c-gold" id="bHint"><i>💡</i>힌트</button>
    <button class="gbtn c-green" id="bReset"><i>⟲</i>다시</button>
    <button class="gbtn c-pink" id="bRand"><i>🎲</i>새 퍼즐</button>
  </div>
  <div class="help">조각을 끌어 윤곽에 맞추세요 · 탭 = 회전 · 우클릭 = 뒤집기 (R / F 키)</div>
</div>
<div id="win"><div class="box">
  <h2>🎉 완성!</h2><div class="wstars" id="wStars"></div><p id="winMsg"></p>
  <div class="row"><button class="btn sec" id="wAgain">다시하기</button><button class="btn" id="wNext">다음 레벨</button></div>
</div></div>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const H = Math.sqrt(3) / 2;               // 정삼각형(한 변 1)의 높이
const COLORS = ['#2f5bff', '#e8261f', '#f5b800', '#1ea84b', '#ff7a1a', '#8b3fd9', '#12b5b0', '#e83e8c'];

/* ---------- 삼각 격자 기하 ----------
   셀 (r,c): (r+c)가 짝수면 ▲, 홀수면 ▼. 한 칸의 x폭은 0.5, 행 높이는 H. */
const isUp = (r, c) => ((r + c) & 1) === 0;
const verts = (r, c) => isUp(r, c)
  ? [[c + 1, r], [c, r + 1], [c + 2, r + 1]]
  : [[c, r], [c + 2, r], [c + 1, r + 1]];            // [vx, vr] 격자 꼭짓점
const toXY = (vx, vr) => [vx * 0.5, vr * H];
const centroid = (r, c) => [(c + 1) / 2, (r + (isUp(r, c) ? 2 / 3 : 1 / 3)) * H];
const polyPoints = (r, c) => verts(r, c).map(([vx, vr]) => toXY(vx, vr).join(',')).join(' ');

function normalize(cells) {
  let minR = Infinity, minC = Infinity;
  for (const [r, c] of cells) { minR = Math.min(minR, r); minC = Math.min(minC, c); }
  const dr = -minR; let dc = -minC;
  if ((dr + dc) & 1) dc += 1;                         // 평행이동은 ▲▼ 성질을 유지해야 함
  return cells.map(([r, c]) => [r + dr, c + dc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function xform(cells, k, flip) {                      // 60°×k 회전 + 선택적 좌우 반전
  const a = k * Math.PI / 3, cs = Math.cos(a), sn = Math.sin(a);
  return normalize(cells.map(([r, c]) => {
    let [x, y] = centroid(r, c);
    x -= 0.5;                                         // 격자 꼭짓점 (vx=1, vr=0)을 중심으로 회전/반전
    if (flip) x = -x;
    const X = x * cs - y * sn + 0.5, Y = x * sn + y * cs;
    const rr = Math.floor(Y / H), up = (Y / H - rr) > 0.5;
    const cc = Math.round(2 * X) - 1;
    if (isUp(rr, cc) !== up) throw new Error('lattice mismatch');
    return [rr, cc];
  }));
}
function bbox(cells) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [r, c] of cells) for (const [vx, vr] of verts(r, c)) {
    const [x, y] = toXY(vx, vr);
    x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
  }
  return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
}

/* ---------- 레벨 생성 (정답 배치를 먼저 만들어 항상 풀 수 있음) ---------- */
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ROWS = 6, COLS = 17;
const inB = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS;
const nbrs = (r, c) => [[r, c - 1], [r, c + 1], isUp(r, c) ? [r + 1, c] : [r - 1, c]].filter(([a, b]) => inB(a, b));

function generate(seed, n, minS, maxS) {
  const rand = rng(seed), pick = a => a[Math.floor(rand() * a.length)];
  for (let attempt = 0; attempt < 2000; attempt++) {
    const used = new Set(), pieces = [];
    let ok = true;
    for (let i = 0; i < n && ok; i++) {
      const size = minS + Math.floor(rand() * (maxS - minS + 1));
      let start;
      if (i === 0) start = [2 + Math.floor(rand() * 2), 6 + Math.floor(rand() * 5)];
      else {
        const cand = [];                                  // 중복 = 인접할수록 가중치↑ (뭉툭한 모양)
        for (const k of used) { const [r, c] = k.split(',').map(Number);
          for (const [a, b] of nbrs(r, c)) if (!used.has(a + ',' + b)) cand.push([a, b]); }
        if (!cand.length) { ok = false; break; }
        start = pick(cand);
      }
      const cells = [start], set = new Set([start.join(',')]);
      while (cells.length < size) {
        const fr = [];
        for (const [r, c] of cells) for (const [a, b] of nbrs(r, c)) {
          const k = a + ',' + b; if (!set.has(k) && !used.has(k)) fr.push([a, b]);
        }
        if (!fr.length) break;
        const p = pick(fr); cells.push(p); set.add(p.join(','));
      }
      if (cells.length < 3) { ok = false; break; }
      for (const c of cells) used.add(c.join(','));
      pieces.push(cells);
    }
    if (!ok) continue;
    let hole = false;                                     // 한 칸짜리 구멍 방지
    for (let r = 0; r < ROWS && !hole; r++) for (let c = 0; c < COLS; c++) {
      if (used.has(r + ',' + c)) continue;
      const nb = [[r, c - 1], [r, c + 1], isUp(r, c) ? [r + 1, c] : [r - 1, c]];
      if (nb.every(([a, b]) => inB(a, b) && used.has(a + ',' + b))) { hole = true; break; }
    }
    if (hole) continue;
    const all = normalize(pieces.flat());                 // 전체를 원점으로 이동 (같은 shift 적용)
    let minR = Infinity, minC = Infinity;
    for (const [r, c] of pieces.flat()) { minR = Math.min(minR, r); minC = Math.min(minC, c); }
    const dr = -minR; let dc = -minC; if ((dr + dc) & 1) dc += 1;
    return pieces.map(p => p.map(([r, c]) => [r + dr, c + dc]));
  }
  throw new Error('generation failed');
}

const LEVELS = [
  [3, 4, 6], [4, 4, 6], [4, 3, 6], [5, 4, 6], [5, 3, 6], [6, 4, 6],
  [6, 3, 6], [7, 4, 6], [7, 3, 6], [8, 4, 6], [8, 3, 6], [9, 3, 6],
];

/* ---------- 게임 상태 ---------- */
const svg = document.getElementById('svg');
let G = null;               // 현재 게임
let timer = null, t0 = 0, elapsed = 0, levelIdx = 0, randomMode = false;

function build(spec, seed) {
  const [n, minS, maxS] = spec;
  const sols = generate(seed, n, minS, maxS);
  const rand = rng(seed * 7 + 1);
  const target = new Set(sols.flat().map(c => c.join(',')));
  const tb = bbox(sols.flat());

  const pieces = sols.map((abs, i) => {
    const base = normalize(abs);
    const cells = xform(base, Math.floor(rand() * 6), rand() < 0.5);
    return { id: i, color: COLORS[i % COLORS.length], cells, solAbs: abs, placed: false,
             pos: { x: 0, y: 0 }, home: { x: 0, y: 0 }, el: null, at: null };
  });

  // 레이아웃: 위 = 보드, 아래 = 트레이
  const margin = 1;
  const trayW = Math.max(tb.w + margin * 2, 8.5);
  const ox = (trayW - tb.w) / 2 - tb.x0, oy = margin - tb.y0;
  const boardBottom = margin + tb.h + margin;
  let x = margin, y = boardBottom + 0.8, rowH = 0;
  for (const p of pieces) {
    const b = bbox(p.cells);
    if (x + b.w > trayW - margin + 1e-6 && x > margin) { x = margin; y += rowH + 0.7; rowH = 0; }
    p.pos = { x: x - b.x0, y: y - b.y0 };
    p.home = { x: x + b.w / 2, y: y + b.h / 2 };
    x += b.w + 0.7; rowH = Math.max(rowH, b.h);
  }
  const totalH = y + rowH + margin;
  return { spec, seed, pieces, target, ox, oy, W: trayW, Hh: totalH, trayTop: boardBottom, sel: null, done: false };
}

function el(name, attrs = {}, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

const shade = (hex, t) => {                           // t>0: 밝게, t<0: 어둡게
  const n = parseInt(hex.slice(1), 16), tgt = t > 0 ? 255 : 0, a = Math.abs(t);
  const ch = sh => Math.round(((n >> sh) & 255) * (1 - a) + tgt * a);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};
function insetPoints(r, c, k) {
  const [cx, cy] = centroid(r, c);
  return verts(r, c).map(([vx, vr]) => { const [x, y] = toXY(vx, vr); return `${cx + (x - cx) * k},${cy + (y - cy) * k}`; }).join(' ');
}
function makeDefs() {
  const d = el('defs', {}, svg);
  COLORS.forEach((col, i) => {
    const g = el('linearGradient', { id: 'g' + i, x1: 0, y1: 0, x2: 0, y2: 1 }, d);
    [[0, shade(col, .5)], [.5, col], [1, shade(col, -.32)]].forEach(([o, c]) => el('stop', { offset: o, 'stop-color': c }, g));
  });
  const hi = el('linearGradient', { id: 'hi', x1: 0, y1: 0, x2: 0, y2: 1 }, d);
  el('stop', { offset: 0, 'stop-color': '#fff', 'stop-opacity': .65 }, hi);
  el('stop', { offset: 1, 'stop-color': '#fff', 'stop-opacity': 0 }, hi);
  const sh = el('filter', { id: 'shadow', x: '-30%', y: '-30%', width: '160%', height: '170%' }, d);
  el('feDropShadow', { dx: 0, dy: .08, stdDeviation: .06, 'flood-color': '#000', 'flood-opacity': .5 }, sh);
  const ss = el('filter', { id: 'shadowSel', x: '-30%', y: '-30%', width: '160%', height: '170%' }, d);
  el('feDropShadow', { dx: 0, dy: .08, stdDeviation: .1, 'flood-color': '#9fe8ff', 'flood-opacity': 1 }, ss);
  const gl = el('filter', { id: 'glow', x: '-20%', y: '-20%', width: '140%', height: '140%' }, d);
  el('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: .09, result: 'b' }, gl);
  const mg = el('feMerge', {}, gl);
  el('feMergeNode', { in: 'b' }, mg); el('feMergeNode', { in: 'b' }, mg); el('feMergeNode', { in: 'SourceGraphic' }, mg);
}

function render() {
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${G.W} ${G.Hh}`);
  makeDefs();
  // 보드 패널 / 트레이 패널
  el('rect', { x: .05, y: .05, width: G.W - .1, height: G.trayTop - .2, rx: .35, fill: 'rgba(8,12,60,.55)', stroke: 'rgba(120,200,255,.35)', 'stroke-width': .05 }, svg);
  el('rect', { x: .05, y: G.trayTop + .1, width: G.W - .1, height: G.Hh - G.trayTop - .15, rx: .35, fill: 'rgba(6,8,40,.5)', stroke: 'rgba(255,255,255,.12)', 'stroke-width': .04 }, svg);

  // 보드: 목표 칸 + 네온 윤곽선
  const gb = el('g', { transform: `translate(${G.ox},${G.oy})` }, svg);
  const edgeCount = new Map();
  for (const k of G.target) {
    const [r, c] = k.split(',').map(Number);
    el('polygon', { points: polyPoints(r, c), fill: '#0d1750', stroke: 'rgba(110,170,255,.4)', 'stroke-width': .03 }, gb);
    const v = verts(r, c);
    for (let i = 0; i < 3; i++) {
      const a = v[i], b = v[(i + 1) % 3];
      const ek = [a.join(','), b.join(',')].sort().join('|');
      edgeCount.set(ek, (edgeCount.get(ek) || 0) + 1);
    }
  }
  const outline = el('g', { filter: 'url(#glow)', 'pointer-events': 'none' }, gb);
  for (const [ek, cnt] of edgeCount) {
    if (cnt !== 1) continue;
    const [a, b] = ek.split('|').map(s => s.split(',').map(Number));
    const [x1, y1] = toXY(...a), [x2, y2] = toXY(...b);
    el('line', { x1, y1, x2, y2, stroke: '#5ee7ff', 'stroke-width': .09, 'stroke-linecap': 'round' }, outline);
  }
  G.hintG = el('g', { transform: `translate(${G.ox},${G.oy})`, 'pointer-events': 'none' }, svg);
  G.ghostG = el('g', { transform: `translate(${G.ox},${G.oy})`, 'pointer-events': 'none' }, svg);
  G.pieceG = el('g', {}, svg);
  for (const p of G.pieces) { p.el = el('g', { class: 'piece', 'data-id': p.id }, G.pieceG); drawPiece(p); }
}

function drawPiece(p) {
  p.el.innerHTML = '';
  const gi = COLORS.indexOf(p.color);
  for (const [r, c] of p.cells) {
    el('polygon', { points: polyPoints(r, c), fill: `url(#g${gi})` }, p.el);
    el('polygon', { points: insetPoints(r, c, .56), fill: 'url(#hi)', class: 'facet' }, p.el);
  }
  p.el.classList.toggle('sel', G.sel === p);
  setPos(p, p.pos.x, p.pos.y);
}
function setPos(p, x, y) { p.pos = { x, y }; p.el.setAttribute('transform', `translate(${x},${y})`); }
const localCenter = p => bbox(p.cells);
const centerOf = p => { const b = localCenter(p); return { x: p.pos.x + b.cx, y: p.pos.y + b.cy }; };
function setCenter(p, x, y) { const b = localCenter(p); setPos(p, x - b.cx, y - b.cy); }

function clampCenter(p, x, y) {
  const b = localCenter(p);
  return [Math.min(Math.max(x, b.w / 2), G.W - b.w / 2), Math.min(Math.max(y, b.h / 2), G.Hh - b.h / 2)];
}

/* ---------- 스냅 / 배치 ---------- */
function occupied(except) {
  const m = new Set();
  for (const q of G.pieces) if (q.placed && q !== except) for (const [r, c] of q.at.cells) m.add(r + ',' + c);
  return m;
}
function trySnap(p) {
  const [r0, c0] = p.cells[0];
  const cx = p.pos.x - G.ox + centroid(r0, c0)[0], cy = p.pos.y - G.oy + centroid(r0, c0)[1];
  let best = null, bd = Infinity;
  for (let r = -3; r < ROWS + 3; r++) for (let c = -3; c < COLS + 4; c++) {
    if (isUp(r, c) !== isUp(r0, c0)) continue;
    const [x, y] = centroid(r, c), d = (x - cx) ** 2 + (y - cy) ** 2;
    if (d < bd) { bd = d; best = [r, c]; }
  }
  if (!best || bd > 0.9 ** 2) return null;
  const dr = best[0] - r0, dc = best[1] - c0;
  const occ = occupied(p), abs = p.cells.map(([r, c]) => [r + dr, c + dc]);
  for (const [r, c] of abs) { const k = r + ',' + c; if (!G.target.has(k) || occ.has(k)) return { ok: false, dr, dc, cells: abs }; }
  return { ok: true, dr, dc, cells: abs };
}
function place(p, s, animate) {
  p.placed = true; p.at = { dr: s.dr, dc: s.dc, cells: s.cells };
  if (animate) { p.el.classList.add('snap'); setTimeout(() => p.el.classList.remove('snap'), 200); }
  setPos(p, G.ox + s.dc * 0.5, G.oy + s.dr * H);
}
function sendHome(p) {
  p.placed = false; p.at = null;
  setCenter(p, ...clampCenter(p, p.home.x, p.home.y));
}
function showGhost(p) {
  G.ghostG.innerHTML = '';
  if (!p) return;
  const s = trySnap(p);
  if (!s) return;
  for (const [r, c] of s.cells)
    el('polygon', { points: polyPoints(r, c), fill: s.ok ? p.color : '#888', 'fill-opacity': s.ok ? .35 : .15,
      stroke: s.ok ? p.color : '#888', 'stroke-width': .06, 'stroke-dasharray': '.15 .1' }, G.ghostG);
}

/* ---------- 조각 변형 ---------- */
function transform(p, k, flip) {
  const wasPlaced = p.placed;
  let c = centerOf(p);
  if (wasPlaced) { p.placed = false; p.at = null; c = { x: p.home.x, y: p.home.y }; }
  p.cells = xform(p.cells, k, flip);
  p.el.parentNode.appendChild(p.el);
  const b = localCenter(p);
  const [x, y] = clampCenter(p, c.x, c.y);
  p.pos = { x: x - b.cx, y: y - b.cy };
  drawPiece(p);
}
function select(p) {
  G.sel = p;
  for (const q of G.pieces) q.el.classList.toggle('sel', q === p);
}

/* ---------- 포인터 입력 ---------- */
const pt = svg.createSVGPoint();
function svgPoint(e) {
  pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM().inverse(), q = pt.matrixTransform(m);
  return { x: q.x, y: q.y };
}
let drag = null;
svg.addEventListener('pointerdown', e => {
  if (!G || G.done) return;
  const g = e.target.closest('.piece');
  if (!g) return;
  e.preventDefault();
  if (e.button === 2) { const p = G.pieces[+g.dataset.id]; select(p); transform(p, 0, true); return; }
  const p = G.pieces[+g.dataset.id], sp = svgPoint(e);
  select(p);
  p.el.parentNode.appendChild(p.el);
  drag = { p, off: { x: sp.x - p.pos.x, y: sp.y - p.pos.y }, sx: e.clientX, sy: e.clientY, moved: false, wasPlaced: p.placed, startPos: { ...p.pos } };
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
  if (!drag.moved) { drag.moved = true; drag.p.placed = false; drag.p.at = null; drag.p.el.classList.add('drag'); }
  const sp = svgPoint(e);
  setPos(drag.p, sp.x - drag.off.x, sp.y - drag.off.y);
  showGhost(drag.p);
});
function endDrag(e) {
  if (!drag) return;
  const { p, moved, wasPlaced } = drag; drag = null;
  p.el.classList.remove('drag'); showGhost(null);
  if (!moved) {                                   // 탭: 트레이 조각은 회전, 놓인 조각은 트레이로 회수
    if (wasPlaced) { p.placed = false; p.at = null; sendHome(p); p.el.classList.add('snap'); setTimeout(() => p.el.classList.remove('snap'), 200); }
    else transform(p, 1, false);
    return;
  }
  const s = trySnap(p);
  if (s && s.ok) { place(p, s, true); checkWin(); }
  else {
    const c = centerOf(p);
    if (c.y > G.trayTop + 0.3) { const [x, y] = clampCenter(p, c.x, c.y); setCenter(p, x, y); p.home = { x, y }; }
    else { p.el.classList.add('snap'); sendHome(p); setTimeout(() => p.el.classList.remove('snap'), 200); }
  }
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- 승리 / 타이머 ---------- */
function checkWin() {
  let n = 0;
  for (const q of G.pieces) if (q.placed) n += q.cells.length;
  if (n !== G.target.size) return;
  G.done = true; clearInterval(timer);
  const par = G.pieces.length * 14, stars = elapsed <= par ? 3 : elapsed <= par * 2 ? 2 : 1;
  setStars(stars);
  document.getElementById('wStars').innerHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? 'on' : ''}" style="animation-delay:${i * .25}s">★</span>`).join('');
  let msg = `걸린 시간 ${fmt(elapsed)}`;
  if (!randomMode) {
    const prev = getBest();
    if (!prev || elapsed < prev) { try { localStorage.setItem('tri-best-' + levelIdx, elapsed); } catch (_) {} if (prev) msg += ' · 🏆 신기록!'; }
    showBest();
  }
  document.getElementById('winMsg').textContent = msg;
  confetti();
  const last = !randomMode && levelIdx >= LEVELS.length - 1;
  document.getElementById('wNext').textContent = randomMode ? '새 퍼즐' : last ? '처음으로' : '다음 레벨';
  if (!randomMode) try { localStorage.setItem('tri-puzzle-max', Math.max(+(localStorage.getItem('tri-puzzle-max') || 0), levelIdx + 1)); } catch (_) {}
  setTimeout(() => document.getElementById('win').classList.add('show'), 350);
}
function setStars(n) {
  document.getElementById('stars').innerHTML = [1, 2, 3].map(i => `<span class="${i <= n ? 'on' : ''}">★</span>`).join('');
}
function getBest() { try { return +localStorage.getItem('tri-best-' + levelIdx) || 0; } catch (_) { return 0; } }
function showBest() { const b = randomMode ? 0 : getBest(); document.getElementById('best').textContent = b ? fmt(b) : '--'; }
function confetti() {
  const w = document.getElementById('win');
  w.querySelectorAll('.confetti').forEach(n => n.remove());
  for (let i = 0; i < 46; i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.cssText = `left:${Math.random() * 100}%;background:${COLORS[i % COLORS.length]};animation-duration:${1.8 + Math.random() * 1.8}s;animation-delay:${Math.random() * .6}s`;
    w.appendChild(d);
  }
}
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function startTimer() {
  clearInterval(timer); elapsed = 0; t0 = Date.now();
  document.getElementById('time').textContent = '0:00';
  timer = setInterval(() => { elapsed = Math.floor((Date.now() - t0) / 1000); document.getElementById('time').textContent = fmt(elapsed); }, 500);
}

/* ---------- 레벨 흐름 ---------- */
function load(spec, seed, label) {
  document.getElementById('win').classList.remove('show');
  G = build(spec, seed);
  render();
  document.getElementById('lvl').innerHTML = label;
  setStars(0); showBest();
  startTimer();
}
function loadLevel(i) {
  randomMode = false;
  levelIdx = (i + LEVELS.length) % LEVELS.length;
  load(LEVELS[levelIdx], 100 + levelIdx * 13, `<small>LEVEL</small><b>${levelIdx + 1}</b>`);
}
function loadRandom() {
  randomMode = true;
  const spec = LEVELS[Math.min(Math.max(levelIdx, 2), LEVELS.length - 1)];
  load(spec, Math.floor(Math.random() * 1e6), '<small>RANDOM</small><b>🎲</b>');
}
function replay() { randomMode ? load(G.spec, G.seed, '<small>RANDOM</small><b>🎲</b>') : loadLevel(levelIdx); }

document.getElementById('bRot').onclick = () => { if (G && !G.done && G.sel) transform(G.sel, 1, false); };
document.getElementById('bFlip').onclick = () => { if (G && !G.done && G.sel) transform(G.sel, 0, true); };
document.getElementById('bReset').onclick = replay;
document.getElementById('bPrev').onclick = () => loadLevel(randomMode ? levelIdx : levelIdx - 1);
document.getElementById('bNext').onclick = () => loadLevel(randomMode ? levelIdx : levelIdx + 1);
document.getElementById('bRand').onclick = loadRandom;
document.getElementById('wAgain').onclick = replay;
document.getElementById('wNext').onclick = () => randomMode ? loadRandom() : loadLevel(levelIdx + 1);
document.getElementById('bHint').onclick = () => {
  if (!G || G.done) return;
  const cand = G.pieces.filter(p => !sameCells(p));
  const p = cand[Math.floor(Math.random() * cand.length)];
  if (!p) return;
  G.hintG.innerHTML = '';
  for (const [r, c] of p.solAbs) el('polygon', { points: polyPoints(r, c), fill: p.color, 'fill-opacity': .45, stroke: p.color, 'stroke-width': .08 }, G.hintG);
  clearTimeout(G.hintT); G.hintT = setTimeout(() => G.hintG.innerHTML = '', 1800);
};
function sameCells(p) {
  if (!p.placed) return false;
  const a = p.at.cells.map(c => c.join(',')).sort().join(';'), b = p.solAbs.map(c => c.join(',')).sort().join(';');
  return a === b;
}
window.addEventListener('keydown', e => {
  if (!G || G.done || !G.sel) return;
  if (e.key === 'r' || e.key === 'R') transform(G.sel, 1, false);
  if (e.key === 'f' || e.key === 'F') transform(G.sel, 0, true);
});

let start = 0;
try { start = Math.min(+(localStorage.getItem('tri-puzzle-max') || 0), LEVELS.length - 1); } catch (_) {}
loadLevel(start);
window.__game = { get G() { return G; }, trySnap, place, checkWin, transform, loadLevel, LEVELS };
})();
</script>
</body>
